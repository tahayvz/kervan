server:
  # --- Duzgun kapanma (Faz 9) ---
  #
  # Kubernetes pod'u kapatirken once SIGTERM gonderir, sure dolunca SIGKILL.
  # Bu ayar YALNIZCA WEB SUNUCUSUNU ilgilendirir: islenmekte olan HTTP istegi
  # yarida kesilmez, bitirilmesi beklenir.
  #
  # Kafka dinleyicileri ve outbox yayincisi bu ayara DEGIL, asagidaki
  # spring.lifecycle.timeout-per-shutdown-phase suresine baglidir; onlar
  # uygulama baglami kapanirken duzenli durur.
  shutdown: graceful
  # 8080 Keycloak'ta; ag gecidi on kapi olarak 8000'de durur.
  port: 8000

spring:
  lifecycle:
    # Bekleyen isler bu sure icinde bitirilmeye calisilir. Kubernetes tarafindaki
    # terminationGracePeriodSeconds bundan UZUN olmali.
    timeout-per-shutdown-phase: 25s
  application:
    name: api-gateway

  data:
    redis:
      # Hız sınırlama sayaçları burada tutulur; kopyalar arasında paylaşılmalı.
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}

  cloud:
    gateway:
      # Bütün rotalara uygulanan sınır. Rota başına farklı sınır gerekseydi filtre
      # rotanın altına yazılırdı; bugün buna ihtiyaç yok ve tek yerde durması
      # hangi sınırın geçerli olduğunu okunur kılıyor.
      default-filters:
        - name: RequestRateLimiter
          args:
            # Jeton kovası: saniyede `replenishRate` jeton dolar, kova en fazla
            # `burstCapacity` tutar. Ani bir yığılma kovadan karşılanır, sürekli
            # yüksek hız ise dolum hızına iner.
            redis-rate-limiter.replenishRate: ${KERVAN_RATE_LIMIT_PER_SECOND:20}
            # Kısa süreli patlamalara izin: bir sayfanın aynı anda attığı birkaç
            # istek sınıra takılmamalı.
            redis-rate-limiter.burstCapacity: ${KERVAN_RATE_LIMIT_BURST:40}
            key-resolver: "#{@rateLimitKeyResolver}"

      routes:
        # Katalog: urun okuma. GET'ler herkese acik (GatewaySecurityConfig).
        - id: catalog
          uri: ${KERVAN_CATALOG_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/products/**
          filters:
            # Bu rotanin KENDI devre kesicisi. Tek ortak kesici olsaydi katalog
            # arizasi siparis trafigini de keserdi; birbirini tanimayan servisler
            # birbirinin arizasini paylasmamali.
            - name: CircuitBreaker
              args:
                name: catalog
                fallbackUri: forward:/fallback/catalog
                # Varsayilan olarak yalnizca ISTISNALAR (zaman asimi, baglanti
                # reddi) basarisizlik sayilir; arka servisin dondurdugu bir 5xx
                # sayilmaz. Bunlari acikca ekliyoruz:
                #
                #   502/503/504 = "arka tarafta bir sey bozuk ya da yok"
                #   500         = EKLENMEDI. Cogu zaman O ISTEGE ozeldir (bozuk
                #                 bir kayit, gecersiz bir parametre). Onu saymak,
                #                 tek bir kotu kaydin butun trafigi kesmesine
                #                 yol acardi.
                statusCodes: "502,503,504"

        # Arama: urun aramasi da katalog listeleme gibi herkese acik. Kisisel veri
        # donmez ve yazma ucu yoktur.
        - id: search
          uri: ${KERVAN_SEARCH_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/search/**
          filters:
            # Bu rotanin KENDI devre kesicisi. Tek ortak kesici olsaydi katalog
            # arizasi siparis trafigini de keserdi; birbirini tanimayan servisler
            # birbirinin arizasini paylasmamali.
            - name: CircuitBreaker
              args:
                name: search
                fallbackUri: forward:/fallback/search
                # Varsayilan olarak yalnizca ISTISNALAR (zaman asimi, baglanti
                # reddi) basarisizlik sayilir; arka servisin dondurdugu bir 5xx
                # sayilmaz. Bunlari acikca ekliyoruz:
                #
                #   502/503/504 = "arka tarafta bir sey bozuk ya da yok"
                #   500         = EKLENMEDI. Cogu zaman O ISTEGE ozeldir (bozuk
                #                 bir kayit, gecersiz bir parametre). Onu saymak,
                #                 tek bir kotu kaydin butun trafigi kesmesine
                #                 yol acardi.
                statusCodes: "502,503,504"

        # Stok: mal kabulu ve stok goruntuleme (ADR-0019). Kimlik dogrulamasi
        # zorunlu; ROL denetimi inventory-service'te yapilir, burada degil
        # (ADR-0007). Yani buradan tokensiz gecen istek 401, musteri token'iyla
        # gecen istek servisten 403 alir.
        - id: stock
          uri: ${KERVAN_INVENTORY_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/stock/**
          filters:
            - name: CircuitBreaker
              args:
                name: stock
                fallbackUri: forward:/fallback/stock
                statusCodes: "502,503,504"

        # Siparis: kimlik dogrulamasi zorunlu. Rol ve sahiplik denetimi
        # order-service'te yapilir, burada degil (ADR-0007).
        - id: orders
          uri: ${KERVAN_ORDER_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            # Bu rotanin KENDI devre kesicisi. Tek ortak kesici olsaydi katalog
            # arizasi siparis trafigini de keserdi; birbirini tanimayan servisler
            # birbirinin arizasini paylasmamali.
            - name: CircuitBreaker
              args:
                name: orders
                fallbackUri: forward:/fallback/orders
                # Varsayilan olarak yalnizca ISTISNALAR (zaman asimi, baglanti
                # reddi) basarisizlik sayilir; arka servisin dondurdugu bir 5xx
                # sayilmaz. Bunlari acikca ekliyoruz:
                #
                #   502/503/504 = "arka tarafta bir sey bozuk ya da yok"
                #   500         = EKLENMEDI. Cogu zaman O ISTEGE ozeldir (bozuk
                #                 bir kayit, gecersiz bir parametre). Onu saymak,
                #                 tek bir kotu kaydin butun trafigi kesmesine
                #                 yol acardi.
                statusCodes: "502,503,504"

  security:
    oauth2:
      resourceserver:
        jwt:
          # order-service ile AYNI ayar. issuer-uri yerine jwk-set-uri kullaniliyor:
          # issuer-uri acilista OIDC kesfi yapar ve Keycloak ayakta degilse uygulama
          # kalkmaz. jwk-set-uri ise anahtarlari ilk dogrulamada ceker.
          jwk-set-uri: ${KERVAN_JWKS_URI:http://localhost:8080/realms/kervan/protocol/openid-connect/certs}

management:
  server:
    # Actuator ANA KAPIDA DEGIL, ayri bir portta.
    #
    # Ag gecidi disariya acilan tek surectir. Metrik ucu yonlendirme kimliklerini,
    # istek hizlarini, JVM ve baglanti havuzu ayrintilarini yayar; bunlarin 8000'de
    # durmasi ic yapiyi disariya anlatmak olurdu. Compose bu portu disari ACMAZ;
    # Prometheus agin icinden okur.
    #
    # Arka servisler icin ayni sorun yok: onlar zaten disariya acilmaz ve ag gecidi
    # /actuator yolunu yonlendirmez.
    port: ${KERVAN_MANAGEMENT_PORT:9000}

  # --- İzleme (tracing) ---
  # Bir isteğin servisler arasında nasıl aktığının kaydı. Her adım bir "span",
  # tüm zincir bir "trace". Gerekçe ve alternatifler: ADR-0012.
  tracing:
    sampling:
      # Lokalde her istek kaydedilir. Üretimde bu oran düşürülür: her isteği
      # saklamak hem ağ hem depolama maliyetidir ve hata ayıklamak için gerekmez.
      probability: ${KERVAN_TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      # Span'ler doğrudan Jaeger'a değil toplayıcıya (OTel Collector) gider.
      # Uygulama tek bir adres bilir; arkadaki sistem değişirse uygulama değişmez.
      endpoint: ${KERVAN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    # Redis'in durumu ag gecidinin sagligini BELIRLEMEZ.
    #
    # Bu acik bir karar: Redis yalnizca hiz sinirlama sayaclarini tutuyor. Saglik
    # ucuna dahil edilseydi, Redis'teki kisa bir kesinti ag gecidini DOWN gosterir,
    # Kubernetes trafigi kesers ve BUTUN API erisilemez olurdu. Yani bir korumanin
    # deposundaki ariza, korudugu seyi yok ederdi.
    #
    # Dogru davranis: hiz siniri calismasa da kapi acik kalir (bkz. RateLimitTest).
    # Redis ayrica izlenir; onun arizasi kendi alarmini uretir.
    redis:
      enabled: false

  metrics:
    distribution:
      # HTTP sürelerini histogram olarak yayınla.
      #
      # Bu satır olmadan Prometheus'ta `_bucket` serileri HİÇ oluşmaz ve
      # `histogram_quantile(...)` boş döner. Pano "veri yok" gösterir, hiçbir hata
      # çıkmaz — p95 grafiği sessizce boş kalır.
      #
      # Bedeli: her uç için ~70 ek zaman serisi. Servis sayısı arttıkça bu maliyet
      # çarpılır; o noktada histogram yalnızca gerçekten gereken uçlarda açılır.
      percentiles-histogram:
        http.server.requests: true

  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # readiness grubu VARSAYILAN olarak yalnizca `readinessState` icerir;
        # veritabani/Kafka gibi bagimliliklar DAHIL DEGILDIR ve bu bilinclidir.
        # Eklenseydi bir veritabani sarsintisi butun pod'lari ayni anda
        # trafikten cekerdi. Ayni gerekce ADR-0011'de de var.
        enabled: true
      show-details: when-authorized

logging:
  structured:
    format:
      # Dosyaya yazilan log JSON olur; konsol insan icin okunur kalir.
      # Ayrim bilincli: konsolu GELISTIRICI okur, dosyayi MAKINE okur.
      #
      # ECS (Elastic Common Schema) hazir bir alan adi sozlugudur. Kendi
      # adlarimizi uydurmak yerine yerlesik bir sozlesme kullaniliyor; toplayici
      # ve Grafana o adlari zaten taniyor.
      file: ecs
  file:
    # Toplayici (Alloy) bu dosyayi okur. Uygulama Loki'yi TANIMAZ: log'un nereye
    # gidecegi bir isletme kararidir, uygulama karari degil (ADR-0015).
    #
    # Varsayilan calisma dizinine gore gorecelidir. Servisleri depo kokunden
    # calistir ya da KERVAN_LOG_FILE ile tam yol ver:
    #   infra/docker/observability/README.md
    name: ${KERVAN_LOG_FILE:logs/api-gateway.json}
  level:
    com.kervan.gateway: INFO

# --- Dayaniklilik (Faz 7) ---
# Karar kaydi: docs/adr/0016-where-circuit-breakers-go.md
resilience4j:
  circuitbreaker:
    configs:
      default:
        # Son N cagriya bakar (sure degil sayi penceresi): dusuk trafikte zaman
        # penceresi cogu zaman bos kalir ve kesici hic karar veremez.
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        # Bu sayidan az cagri varken karar VERILMEZ. Olmasaydi ilk cagri
        # basarisiz oldugunda oran %100 gorunur ve kesici hemen acilirdi.
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        # Acik kalma suresi. Cok kisa olursa cokmus servise hemen geri yuklenir;
        # cok uzun olursa duzelen servis bosuna bekletilir.
        waitDurationInOpenState: 10s
        # Yari acik durumda birkac deneme cagrisi gecirilir; hepsi basariliysa
        # kesici kapanir.
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Durum degisiklikleri metrik olarak yayinlanir (Faz 6 panosunda gorunur).
        registerHealthIndicator: false
    instances:
      catalog:
        baseConfig: default
      search:
        baseConfig: default
      orders:
        baseConfig: default
      stock:
        baseConfig: default

  timelimiter:
    configs:
      default:
        # ZAMAN ASIMI OLMADAN DEVRE KESICI ISE YARAMAZ.
        #
        # Kesici basarisizlik sayar. Askida kalan bir cagri ise basarisiz degildir
        # -- cevap beklenmeye devam eder. Zaman asimi olmadan yavas bir servis
        # kesiciyi hic tetiklemez ve istekler birikir. Uretimde asil sik gorulen
        # ariza da cokme degil YAVASLAMADIR.
        timeoutDuration: 2s
        cancelRunningFuture: true
    instances:
      catalog:
        baseConfig: default
      search:
        baseConfig: default
      orders:
        baseConfig: default
      stock:
        baseConfig: default
