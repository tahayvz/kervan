server:
  # 8080 Keycloak'ta; ag gecidi on kapi olarak 8000'de durur.
  port: 8000

spring:
  application:
    name: api-gateway

  data:
    redis:
      # Hız sınırlama sayaçları burada tutulur; kopyalar arasında paylaşılmalı.
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}

  cloud:
    gateway:
      # Bütün rotalara uygulanan sınır. Rota başına farklı sınır gerekseydi filtre
      # rotanın altına yazılırdı; bugün buna ihtiyaç yok ve tek yerde durması
      # hangi sınırın geçerli olduğunu okunur kılıyor.
      default-filters:
        - name: RequestRateLimiter
          args:
            # Jeton kovası: saniyede `replenishRate` jeton dolar, kova en fazla
            # `burstCapacity` tutar. Ani bir yığılma kovadan karşılanır, sürekli
            # yüksek hız ise dolum hızına iner.
            redis-rate-limiter.replenishRate: ${KERVAN_RATE_LIMIT_PER_SECOND:20}
            # Kısa süreli patlamalara izin: bir sayfanın aynı anda attığı birkaç
            # istek sınıra takılmamalı.
            redis-rate-limiter.burstCapacity: ${KERVAN_RATE_LIMIT_BURST:40}
            key-resolver: "#{@rateLimitKeyResolver}"

      routes:
        # Katalog: urun okuma. GET'ler herkese acik (GatewaySecurityConfig).
        - id: catalog
          uri: ${KERVAN_CATALOG_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/products/**

        # Arama: urun aramasi da katalog listeleme gibi herkese acik. Kisisel veri
        # donmez ve yazma ucu yoktur.
        - id: search
          uri: ${KERVAN_SEARCH_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/search/**

        # Siparis: kimlik dogrulamasi zorunlu. Rol ve sahiplik denetimi
        # order-service'te yapilir, burada degil (ADR-0007).
        - id: orders
          uri: ${KERVAN_ORDER_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**

  security:
    oauth2:
      resourceserver:
        jwt:
          # order-service ile AYNI ayar. issuer-uri yerine jwk-set-uri kullaniliyor:
          # issuer-uri acilista OIDC kesfi yapar ve Keycloak ayakta degilse uygulama
          # kalkmaz. jwk-set-uri ise anahtarlari ilk dogrulamada ceker.
          jwk-set-uri: ${KERVAN_JWKS_URI:http://localhost:8080/realms/kervan/protocol/openid-connect/certs}

management:
  # --- İzleme (tracing) ---
  # Bir isteğin servisler arasında nasıl aktığının kaydı. Her adım bir "span",
  # tüm zincir bir "trace". Gerekçe ve alternatifler: ADR-0012.
  tracing:
    sampling:
      # Lokalde her istek kaydedilir. Üretimde bu oran düşürülür: her isteği
      # saklamak hem ağ hem depolama maliyetidir ve hata ayıklamak için gerekmez.
      probability: ${KERVAN_TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      # Span'ler doğrudan Jaeger'a değil toplayıcıya (OTel Collector) gider.
      # Uygulama tek bir adres bilir; arkadaki sistem değişirse uygulama değişmez.
      endpoint: ${KERVAN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    # Redis'in durumu ag gecidinin sagligini BELIRLEMEZ.
    #
    # Bu acik bir karar: Redis yalnizca hiz sinirlama sayaclarini tutuyor. Saglik
    # ucuna dahil edilseydi, Redis'teki kisa bir kesinti ag gecidini DOWN gosterir,
    # Kubernetes trafigi kesers ve BUTUN API erisilemez olurdu. Yani bir korumanin
    # deposundaki ariza, korudugu seyi yok ederdi.
    #
    # Dogru davranis: hiz siniri calismasa da kapi acik kalir (bkz. RateLimitTest).
    # Redis ayrica izlenir; onun arizasi kendi alarmini uretir.
    redis:
      enabled: false

  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.kervan.gateway: INFO
