spring:
  lifecycle:
    # Bekleyen isler bu sure icinde bitirilmeye calisilir. Kubernetes tarafindaki
    # terminationGracePeriodSeconds bundan UZUN olmali.
    timeout-per-shutdown-phase: 25s
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:kervan}
    password: ${SPRING_DATASOURCE_PASSWORD:kervan}

  jpa:
    hibernate:
      # Şema Flyway'in sorumluluğunda; Hibernate'in tabloya dokunmasına izin verilmez.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    listener:
      # Tüketilen her mesaj için span üretilir ve mesajın `traceparent` başlığı
      # okunarak ÜRETEN tarafın izine bağlanır. Kapalı olsaydı her servis kendi
      # ayrı izini başlatır, zincir Jaeger'da kopuk görünürdü.
      observation-enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Üreticiler burada değil, KafkaProducerConfig'te tanımlı: bu serviste iki farklı
    # üretici var (outbox baytları / ölü mektup Avro nesnesi) ve Boot yalnızca tek
    # bir KafkaTemplate otomatik kurar.

    consumer:
      group-id: order-service
      # Saga cevapları baştan okunur: servis ilk kez ayağa kalktığında bekleyen
      # cevaplar kaybolmasın.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
        # Şemadan üretilen sınıf gelsin: tipe göre yönlendirme (@KafkaHandler) buna
        # dayanır.
        specific.avro.reader: true

  task:
    scheduling:
      # Varsayılan havuz TEK iş parçacığıdır ve bu serviste artık dört zamanlanmış
      # iş var: outbox yayıncısı (saniyede bir, gönderim 5 sn'ye kadar bloklayabilir),
      # outbox temizliği (saatte bir, turda 100 partiye kadar), outbox metrikleri ve
      # saga metrikleri.
      #
      # Tek iş parçacığında temizlik uzun sürdüğünde metrik yenilemesi hiç
      # çalışmaz: gecikme grafiği tablonun en şişkin olduğu anda DONAR ve o değere
      # kurulmuş alarm bayat veri okur. Ters yönde de metrik sorguları yayıncının
      # turu arasına girer.
      pool:
        size: 4

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak'ın imzalama anahtarları. Anahtar döndürüldüğünde (key rotation)
          # Spring bu adresten yenisini kendisi çeker; anahtarı dosyaya gömmek
          # rotasyonu elle iş hâline getirirdi.
          jwk-set-uri: ${KERVAN_JWKS_URI:http://localhost:8080/realms/kervan/protocol/openid-connect/certs}

kervan:
  kafka:
    retry:
      # Sürekli hata veren mesaj birkaç kez, aralığı açılarak denenir; sonra
      # <konu>.DLT'ye taşınır ve kuyruk akmaya devam eder.
      initial-interval-ms: 500
      max-interval-ms: 10000
      max-elapsed-ms: 30000

  schema-registry:
    # Schema Registry'nin kendi varsayılanı 8081'dir ama o port lokalde
    # catalog-service'in. Konteyner içeride 8081 dinler, dışarıya 8085'ten açılır.
    url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
    # Şemayı uygulamanın kendisi kaydeder. Geliştirmede pratik; üretimde
    # kapatılmalı, şema denetimden geçmiş ayrı bir adımda yayınlanmalıdır.
    auto-register: ${KERVAN_SCHEMA_AUTO_REGISTER:true}

  # Bu servisin yazdığı konular. Olaylar kendi konusuna, komutlar hedef servisin
  # komut konusuna gider (ADR-0009). Hedef, outbox satırının kendisinde durur;
  # Debezium yönlendirmeyi ona göre yapar.
  topics:
    order-events: kervan.orders.events
    inventory-commands: kervan.inventory.commands
    payment-commands: kervan.payments.commands
    # Saga'yı ilerleten cevaplar buradan gelir.
    inventory-events: kervan.inventory.events
    payment-events: kervan.payments.events

  outbox:
    publisher:
      # Uygulama içi yayıncı. Debezium (CDC) devreye alındığında false yapılır;
      # ikisi birden açık olursa her olay iki kez gider.
      # Karşılaştırma: infra/docker/debezium/README.md
      enabled: ${KERVAN_OUTBOX_PUBLISHER_ENABLED:true}
    poll-interval-ms: 1000
    batch-size: 100
    # Bu sayıya ulaşan kayıt kenara alınır; kuyruğun başını tıkamaz.
    max-attempts: 5
    # Transaction'ın açık kalabileceği süreyi sınırlar (bkz. OutboxPublisher).
    send-timeout: 5s

    cleanup:
      enabled: ${KERVAN_OUTBOX_CLEANUP_ENABLED:true}
      # Bu yaştan eski kayıtlar silinir. Debezium devredeyken ölçüt yalnızca yaştır
      # (orada "yayınlandı" işareti yoktur), bu yüzden pencere Debezium'un
      # durabileceği en uzun süreden GENİŞ olmalıdır. Bkz. OutboxCleaner.
      retention: 7d
      # Saatte bir; temizlik acele bir iş değil.
      interval-ms: 3600000
      # Tek PARTİDE silinecek azami satır. Sınırsız bir DELETE tabloyu uzun süre
      # kilitler ve sipariş yazan istekler bekler.
      batch-size: 1000
      # Bir tur, silinecek kayıt kalmayana kadar parti parti devam eder; bu sayı
      # üst sınırdır. Sınıra takılmak "temizlik yetişemiyor" demektir ve uyarı
      # olarak loglanır. 100 x 1000 = turda 100.000 satır.
      max-batches-per-run: 100

server:
  # --- Duzgun kapanma (Faz 9) ---
  #
  # Kubernetes pod'u kapatirken once SIGTERM gonderir, sure dolunca SIGKILL.
  # Bu ayar YALNIZCA WEB SUNUCUSUNU ilgilendirir: islenmekte olan HTTP istegi
  # yarida kesilmez, bitirilmesi beklenir.
  #
  # Kafka dinleyicileri ve outbox yayincisi bu ayara DEGIL, asagidaki
  # spring.lifecycle.timeout-per-shutdown-phase suresine baglidir; onlar
  # uygulama baglami kapanirken duzenli durur.
  shutdown: graceful
  port: 8082

management:
  server:
    # Actuator, is trafiginin portunda DEGIL; ayri bir yonetim portunda.
    #
    # Tek kural, istisnasiz: olcum ve saglik uclari is trafiginin portunu
    # paylasmaz. Boylece "hangi uc acik, hangisi kapali" sorusu her serviste
    # ayni cevabi verir ve yeni bir uc eklemek guvenlik ayari gozden gecirmeyi
    # gerektirmez.
    #
    # Bu portu koruyan sey AG'dir, token degil: compose disari acmaz, Prometheus
    # agin icinden okur. Dusman bir agda calisilacaksa buraya mTLS ya da kimlik
    # dogrulama eklenir (ADR-0014).
    port: ${KERVAN_MANAGEMENT_PORT:9082}

  # --- İzleme (tracing) ---
  # Bir isteğin servisler arasında nasıl aktığının kaydı. Her adım bir "span",
  # tüm zincir bir "trace". Gerekçe ve alternatifler: ADR-0012.
  tracing:
    sampling:
      # Lokalde her istek kaydedilir. Üretimde bu oran düşürülür: her isteği
      # saklamak hem ağ hem depolama maliyetidir ve hata ayıklamak için gerekmez.
      probability: ${KERVAN_TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      # Span'ler doğrudan Jaeger'a değil toplayıcıya (OTel Collector) gider.
      # Uygulama tek bir adres bilir; arkadaki sistem değişirse uygulama değişmez.
      endpoint: ${KERVAN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      # HTTP sürelerini histogram olarak yayınla.
      #
      # Bu satır olmadan Prometheus'ta `_bucket` serileri HİÇ oluşmaz ve
      # `histogram_quantile(...)` boş döner. Pano "veri yok" gösterir, hiçbir hata
      # çıkmaz — p95 grafiği sessizce boş kalır.
      #
      # Bedeli: her uç için ~70 ek zaman serisi. Servis sayısı arttıkça bu maliyet
      # çarpılır; o noktada histogram yalnızca gerçekten gereken uçlarda açılır.
      percentiles-histogram:
        http.server.requests: true

  endpoint:
    health:
      # Kubernetes probe'lari icin iki AYRI uc acar:
      #   /actuator/health/liveness   "surec kendini toparlayamaz halde mi?"
      #                               degilse YENIDEN BASLAT
      #   /actuator/health/readiness  "su an trafik alabilir mi?"
      #                               degilse TRAFIGI KES
      #
      # DIKKAT: readiness grubu VARSAYILAN olarak yalnizca `readinessState`
      # icerir -- veritabani, Kafka gibi BAGIMLILIKLAR DAHIL DEGILDIR. Yani
      # veritabani erisilemezken bile bu uc UP doner.
      #
      # Bu BILINCLI. Bagimliliklari eklemek (group.readiness.include=...,db)
      # bir veritabani sarsintisinda BUTUN pod'lari ayni anda trafikten
      # cekerdi: hicbiri istek alamaz, servis tamamen kaybolur. Oysa kismi
      # calisan bir servis, hic calismayandan iyidir.
      #
      # Ayni gerekce Faz 5'te Redis'i ag gecidinin sagligina dahil etmeme
      # kararinda da vardi (ADR-0011).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  structured:
    format:
      # Dosyaya yazilan log JSON olur; konsol insan icin okunur kalir.
      # Ayrim bilincli: konsolu GELISTIRICI okur, dosyayi MAKINE okur.
      #
      # ECS (Elastic Common Schema) hazir bir alan adi sozlugudur. Kendi
      # adlarimizi uydurmak yerine yerlesik bir sozlesme kullaniliyor; toplayici
      # ve Grafana o adlari zaten taniyor.
      file: ecs
  file:
    # Toplayici (Alloy) bu dosyayi okur. Uygulama Loki'yi TANIMAZ: log'un nereye
    # gidecegi bir isletme kararidir, uygulama karari degil (ADR-0015).
    #
    # Varsayilan calisma dizinine gore gorecelidir. Servisleri depo kokunden
    # calistir ya da KERVAN_LOG_FILE ile tam yol ver:
    #   infra/docker/observability/README.md
    name: ${KERVAN_LOG_FILE:logs/order-service.json}
