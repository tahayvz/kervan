spring:
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:kervan}
    password: ${SPRING_DATASOURCE_PASSWORD:kervan}

  jpa:
    hibernate:
      # Şema Flyway'in sorumluluğunda; Hibernate'in tabloya dokunmasına izin verilmez.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Gövde outbox tablosunda zaten Avro baytları olarak duruyor; yayıncı onu
      # olduğu gibi taşır. Serileştirme sipariş yazan transaction'da yapıldı.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # Broker'ların tamamı yazmayı onaylamadan başarı sayma; outbox'ın "gönderildi"
      # işareti ancak gerçekten dayanıklı yazımdan sonra konmalı.
      acks: all

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak'ın imzalama anahtarları. Anahtar döndürüldüğünde (key rotation)
          # Spring bu adresten yenisini kendisi çeker; anahtarı dosyaya gömmek
          # rotasyonu elle iş hâline getirirdi.
          jwk-set-uri: ${KERVAN_JWKS_URI:http://localhost:8080/realms/kervan/protocol/openid-connect/certs}

kervan:
  schema-registry:
    # Schema Registry'nin kendi varsayılanı 8081'dir ama o port lokalde
    # catalog-service'in. Konteyner içeride 8081 dinler, dışarıya 8085'ten açılır.
    url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
    # Şemayı uygulamanın kendisi kaydeder. Geliştirmede pratik; üretimde
    # kapatılmalı, şema denetimden geçmiş ayrı bir adımda yayınlanmalıdır.
    auto-register: ${KERVAN_SCHEMA_AUTO_REGISTER:true}

  outbox:
    # Debezium devredeyken konu adı konektör ayarında da yazılı
    # (infra/docker/debezium/order-outbox-connector.json → route.topic.replacement).
    # İkisi ayrı sistemde olduğu için ortak bir sabitte tutulamıyor; biri
    # değişirse diğeri de değişmeli.
    topic: kervan.orders.events
    publisher:
      # Uygulama içi yayıncı. Debezium (CDC) devreye alındığında false yapılır;
      # ikisi birden açık olursa her olay iki kez gider.
      # Karşılaştırma: infra/docker/debezium/README.md
      enabled: ${KERVAN_OUTBOX_PUBLISHER_ENABLED:true}
    poll-interval-ms: 1000
    batch-size: 100
    # Bu sayıya ulaşan kayıt kenara alınır; kuyruğun başını tıkamaz.
    max-attempts: 5
    # Transaction'ın açık kalabileceği süreyi sınırlar (bkz. OutboxPublisher).
    send-timeout: 5s

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
