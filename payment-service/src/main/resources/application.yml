server:
  # 8080 Keycloak, 8081 catalog, 8082 order, 8083 Kafka Connect, 8084 inventory,
  # 8085 Schema Registry.
  port: 8086

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${SPRING_DATASOURCE_USERNAME:kervan}
    password: ${SPRING_DATASOURCE_PASSWORD:kervan}

  jpa:
    hibernate:
      # Şema Flyway'in sorumluluğunda; Hibernate tabloya dokunmaz.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    listener:
      # Tüketilen her mesaj için span üretilir ve mesajın `traceparent` başlığı
      # okunarak ÜRETEN tarafın izine bağlanır. Kapalı olsaydı her servis kendi
      # ayrı izini başlatır, zincir Jaeger'da kopuk görünürdü.
      observation-enabled: true
    template:
      # Gönderilen mesaja `traceparent` başlığı eklenir.
      observation-enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Üretici YALNIZCA ölü mektup konusu (DLT) için var. İş olayları Kafka'ya buradan
    # değil, outbox üzerinden Debezium ile gider (ADR-0004). DLT işletim kanalıdır:
    # kimse onu iş akışı olarak tüketmez, insan bakar.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
    consumer:
      group-id: payment-service
      # Komutları baştan okur: servis ilk kez ayağa kalktığında bekleyen komutlar
      # kaybolmasın.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
        # Genel amaçlı GenericRecord değil, şemadan üretilen sınıf gelsin: mesaj
        # tipine göre yönlendirme (@KafkaHandler) buna dayanır.
        specific.avro.reader: true

kervan:
  kafka:
    retry:
      # Sürekli hata veren mesaj birkaç kez, aralığı açılarak denenir; sonra
      # <konu>.DLT'ye taşınır ve kuyruk akmaya devam eder. Bkz. KafkaErrorHandlingConfig.
      initial-interval-ms: 500
      max-interval-ms: 10000
      max-elapsed-ms: 30000

  schema-registry:
    url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
    # Şemayı uygulama kaydeder. Üretimde kapatılmalı; şema denetimden geçmiş ayrı
    # bir adımda yayınlanır.
    auto-register: ${KERVAN_SCHEMA_AUTO_REGISTER:true}

  payment:
    # Saga komutları buradan gelir, olaylar buraya gider (ADR-0009).
    commands-topic: kervan.payments.commands
    events-topic: kervan.payments.events

    simulator:
      # Gerçek bir ödeme sağlayıcısı yok; bu sınırın üstündeki tutar reddedilir.
      # Kural tabanlı, rastgele değil: testler saga'nın başarısızlık yolunu
      # kararlı biçimde çalıştırabilsin diye. Bkz. SimulatedPaymentGateway.
      decline-above: ${KERVAN_PAYMENT_DECLINE_ABOVE:10000.00}

management:
  # --- İzleme (tracing) ---
  # Bir isteğin servisler arasında nasıl aktığının kaydı. Her adım bir "span",
  # tüm zincir bir "trace". Gerekçe ve alternatifler: ADR-0012.
  tracing:
    sampling:
      # Lokalde her istek kaydedilir. Üretimde bu oran düşürülür: her isteği
      # saklamak hem ağ hem depolama maliyetidir ve hata ayıklamak için gerekmez.
      probability: ${KERVAN_TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      # Span'ler doğrudan Jaeger'a değil toplayıcıya (OTel Collector) gider.
      # Uygulama tek bir adres bilir; arkadaki sistem değişirse uygulama değişmez.
      endpoint: ${KERVAN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
