server:
  # --- Duzgun kapanma (Faz 9) ---
  #
  # Kubernetes pod'u kapatirken once SIGTERM gonderir, sure dolunca SIGKILL.
  # Bu ayar YALNIZCA WEB SUNUCUSUNU ilgilendirir: islenmekte olan HTTP istegi
  # yarida kesilmez, bitirilmesi beklenir.
  #
  # Kafka dinleyicileri ve outbox yayincisi bu ayara DEGIL, asagidaki
  # spring.lifecycle.timeout-per-shutdown-phase suresine baglidir; onlar
  # uygulama baglami kapanirken duzenli durur.
  shutdown: graceful
  # 8080 Keycloak, 8081 catalog, 8082 order, 8083 Kafka Connect, 8084 inventory,
  # 8085 Schema Registry.
  port: 8086

spring:
  lifecycle:
    # Bekleyen isler bu sure icinde bitirilmeye calisilir. Kubernetes tarafindaki
    # terminationGracePeriodSeconds bundan UZUN olmali.
    timeout-per-shutdown-phase: 25s
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${SPRING_DATASOURCE_USERNAME:kervan}
    password: ${SPRING_DATASOURCE_PASSWORD:kervan}

  jpa:
    hibernate:
      # Şema Flyway'in sorumluluğunda; Hibernate tabloya dokunmaz.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    listener:
      # Tüketilen her mesaj için span üretilir ve mesajın `traceparent` başlığı
      # okunarak ÜRETEN tarafın izine bağlanır. Kapalı olsaydı her servis kendi
      # ayrı izini başlatır, zincir Jaeger'da kopuk görünürdü.
      observation-enabled: true
    template:
      # Gönderilen mesaja `traceparent` başlığı eklenir.
      observation-enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Üretici YALNIZCA ölü mektup konusu (DLT) için var. İş olayları Kafka'ya buradan
    # değil, outbox üzerinden Debezium ile gider (ADR-0004). DLT işletim kanalıdır:
    # kimse onu iş akışı olarak tüketmez, insan bakar.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
    consumer:
      group-id: payment-service
      # Komutları baştan okur: servis ilk kez ayağa kalktığında bekleyen komutlar
      # kaybolmasın.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
        # Genel amaçlı GenericRecord değil, şemadan üretilen sınıf gelsin: mesaj
        # tipine göre yönlendirme (@KafkaHandler) buna dayanır.
        specific.avro.reader: true

kervan:
  kafka:
    retry:
      # Sürekli hata veren mesaj birkaç kez, aralığı açılarak denenir; sonra
      # <konu>.DLT'ye taşınır ve kuyruk akmaya devam eder. Bkz. KafkaErrorHandlingConfig.
      initial-interval-ms: 500
      max-interval-ms: 10000
      max-elapsed-ms: 30000

  schema-registry:
    url: ${KERVAN_SCHEMA_REGISTRY_URL:http://localhost:8085}
    # Şemayı uygulama kaydeder. Üretimde kapatılmalı; şema denetimden geçmiş ayrı
    # bir adımda yayınlanır.
    auto-register: ${KERVAN_SCHEMA_AUTO_REGISTER:true}

  payment:
    # Saga komutları buradan gelir, olaylar buraya gider (ADR-0009).
    commands-topic: kervan.payments.commands
    events-topic: kervan.payments.events

    simulator:
      # Gerçek bir ödeme sağlayıcısı yok; bu sınırın üstündeki tutar reddedilir.
      # Kural tabanlı, rastgele değil: testler saga'nın başarısızlık yolunu
      # kararlı biçimde çalıştırabilsin diye. Bkz. SimulatedPaymentGateway.
      decline-above: ${KERVAN_PAYMENT_DECLINE_ABOVE:10000.00}

management:
  server:
    # Actuator, is trafiginin portunda DEGIL; ayri bir yonetim portunda.
    #
    # Tek kural, istisnasiz: olcum ve saglik uclari is trafiginin portunu
    # paylasmaz. Boylece "hangi uc acik, hangisi kapali" sorusu her serviste
    # ayni cevabi verir ve yeni bir uc eklemek guvenlik ayari gozden gecirmeyi
    # gerektirmez.
    #
    # Bu portu koruyan sey AG'dir, token degil: compose disari acmaz, Prometheus
    # agin icinden okur. Dusman bir agda calisilacaksa buraya mTLS ya da kimlik
    # dogrulama eklenir (ADR-0014).
    port: ${KERVAN_MANAGEMENT_PORT:9086}

  # --- İzleme (tracing) ---
  # Bir isteğin servisler arasında nasıl aktığının kaydı. Her adım bir "span",
  # tüm zincir bir "trace". Gerekçe ve alternatifler: ADR-0012.
  tracing:
    sampling:
      # Lokalde her istek kaydedilir. Üretimde bu oran düşürülür: her isteği
      # saklamak hem ağ hem depolama maliyetidir ve hata ayıklamak için gerekmez.
      probability: ${KERVAN_TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      # Span'ler doğrudan Jaeger'a değil toplayıcıya (OTel Collector) gider.
      # Uygulama tek bir adres bilir; arkadaki sistem değişirse uygulama değişmez.
      endpoint: ${KERVAN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      # HTTP sürelerini histogram olarak yayınla.
      #
      # Bu satır olmadan Prometheus'ta `_bucket` serileri HİÇ oluşmaz ve
      # `histogram_quantile(...)` boş döner. Pano "veri yok" gösterir, hiçbir hata
      # çıkmaz — p95 grafiği sessizce boş kalır.
      #
      # Bedeli: her uç için ~70 ek zaman serisi. Servis sayısı arttıkça bu maliyet
      # çarpılır; o noktada histogram yalnızca gerçekten gereken uçlarda açılır.
      percentiles-histogram:
        http.server.requests: true

  endpoint:
    health:
      # Kubernetes probe'lari icin iki AYRI uc acar:
      #   /actuator/health/liveness   "surec kendini toparlayamaz halde mi?"
      #                               degilse YENIDEN BASLAT
      #   /actuator/health/readiness  "su an trafik alabilir mi?"
      #                               degilse TRAFIGI KES
      #
      # DIKKAT: readiness grubu VARSAYILAN olarak yalnizca `readinessState`
      # icerir -- veritabani, Kafka gibi BAGIMLILIKLAR DAHIL DEGILDIR. Yani
      # veritabani erisilemezken bile bu uc UP doner.
      #
      # Bu BILINCLI. Bagimliliklari eklemek (group.readiness.include=...,db)
      # bir veritabani sarsintisinda BUTUN pod'lari ayni anda trafikten
      # cekerdi: hicbiri istek alamaz, servis tamamen kaybolur. Oysa kismi
      # calisan bir servis, hic calismayandan iyidir.
      #
      # Ayni gerekce Faz 5'te Redis'i ag gecidinin sagligina dahil etmeme
      # kararinda da vardi (ADR-0011).
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  structured:
    format:
      # Dosyaya yazilan log JSON olur; konsol insan icin okunur kalir.
      # Ayrim bilincli: konsolu GELISTIRICI okur, dosyayi MAKINE okur.
      #
      # ECS (Elastic Common Schema) hazir bir alan adi sozlugudur. Kendi
      # adlarimizi uydurmak yerine yerlesik bir sozlesme kullaniliyor; toplayici
      # ve Grafana o adlari zaten taniyor.
      file: ecs
  file:
    # Toplayici (Alloy) bu dosyayi okur. Uygulama Loki'yi TANIMAZ: log'un nereye
    # gidecegi bir isletme kararidir, uygulama karari degil (ADR-0015).
    #
    # Varsayilan calisma dizinine gore gorecelidir. Servisleri depo kokunden
    # calistir ya da KERVAN_LOG_FILE ile tam yol ver:
    #   infra/docker/observability/README.md
    name: ${KERVAN_LOG_FILE:logs/payment-service.json}

# --- Dayaniklilik (Faz 7) ---
# Zincir kodda ACIKCA kuruluyor: ResilientPaymentGateway.
# Karar kaydi: docs/adr/0016-where-circuit-breakers-go.md
resilience4j:
  circuitbreaker:
    instances:
      payment-provider:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # REDDEDILME BASARISIZLIK DEGILDIR.
        #
        # Saglayici calisiyor ve "hayir" diyor. Bunu saymak, mesru bir ret
        # dalgasinin (kampanya sonrasi limit asimlari, dolandiricilik dalgasi)
        # kesiciyi acmasi ve CALISAN bir saglayiciya giden butun odemelerin
        # kesilmesi demekti. Sistem, hicbir sey bozuk degilken kendini kapatirdi.
        ignoreExceptions:
          - com.kervan.payment.domain.model.PaymentDeclinedException

  retry:
    instances:
      payment-provider:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # Hangi hatanin tekrar denenebilecegi TIPTEN degil, hatanin ICERIGINDEN
        # anlasilir: istek saglayiciya ulasmis olabilir mi? Gerekce sinifin
        # kendi belgesinde.
        retryExceptionPredicate: com.kervan.payment.infrastructure.messaging.RetryableProviderFailures

  bulkhead:
    instances:
      payment-provider:
        # Saglayiciya ayni anda en fazla bu kadar cagri gider. Yavaslayan bir dis
        # sistem, tuketici is parcaciklarinin tamamini yutmamali: sinir olmasaydi
        # odeme yavasligi butun servisi durdururdu.
        maxConcurrentCalls: 8
        # Sira beklemez. Beklemek gecikmeyi gizler ve sorunu yukari tasir;
        # hemen "mesgulum" demek dogru cevaptir.
        maxWaitDuration: 0
