name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers gercek MongoDB, PostgreSQL ve Kafka baslatir;
      # ubuntu-latest runner'inda Docker hazir gelir.
      - name: Run tests
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 14

  images:
    name: Service images build
    runs-on: ubuntu-latest
    needs: [ build ]
    strategy:
      matrix:
        service: [ catalog-service, order-service ]
    steps:
      - uses: actions/checkout@v7

      # Imajlar repo kokunden build edilir (parent POM'a erismek icin).
      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t kervan/${{ matrix.service }}:ci .
