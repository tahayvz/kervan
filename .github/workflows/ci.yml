name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers gercek MongoDB, PostgreSQL ve Kafka baslatir;
      # ubuntu-latest runner'inda Docker hazir gelir.
      - name: Run tests
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 14

  images:
    name: Service images build
    runs-on: ubuntu-latest
    needs: [ build ]
    strategy:
      matrix:
        service: [ catalog-service, order-service, inventory-service, payment-service, search-service, api-gateway ]
    steps:
      - uses: actions/checkout@v7

      # Imajlar repo kokunden build edilir (parent POM'a erismek icin).
      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t kervan/${{ matrix.service }}:ci .

      # Imaj bir sonraki ise (deploy-verify) TASINMALI.
      #
      # Neden dosya olarak? Cunku alti imaji tek makinede art arda derlemek
      # ~30 dakika surer (olculdu: 8+7+6+5+2+2 dk). Bu matris onlari PARALEL
      # derliyor; dosya olarak tasimak o paralelligi koruyor ve yalnizca
      # bir-iki dakika ekliyor.
      - name: Save ${{ matrix.service }} image
        run: docker save kervan/${{ matrix.service }}:ci | gzip > /tmp/${{ matrix.service }}.tar.gz

      - name: Upload ${{ matrix.service }} image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar.gz
          retention-days: 1
          # Imaj zaten gzip'li; tekrar sikistirmak yalnizca CPU yer.
          compression-level: 0

  chart:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ucuz kapi. 20 saniye surer ve sablon hatasini, pahali dogrulama isine
      # girmeden yakalar.
      - name: helm lint
        run: helm lint infra/k8s/helm/kervan

      # Her iki deger dosyasi da uretilebiliyor mu? Biri bozulursa digeri
      # yesil kalabilir; ikisi de denenmeli.
      - name: helm template (varsayilan + kind + ci)
        run: |
          for f in "" "-f infra/k8s/helm/kervan/values-kind.yaml" "-f infra/k8s/helm/kervan/values-ci.yaml"; do
            echo "--- helm template ${f:-<varsayilan>}"
            helm template kervan infra/k8s/helm/kervan $f > /dev/null
          done

  deploy-verify:
    name: Deploy to kind and smoke test
    runs-on: ubuntu-latest
    needs: [ images, chart ]
    # Normalde ~10-12 dakika surer. Ust sinir savunma amacli: asagidaki
    # bekleme tek basina 15 dakikaya kadar cikabiliyor, uzerine kume kurulumu
    # ve imaj yukleme biniyor. Takilan bir isi saatlerce kosturmamak icin var,
    # beklenen sureyi anlatmak icin degil.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Download service images
        uses: actions/download-artifact@v7
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      # Elasticsearch bu ayar olmadan ACILMAZ:
      #   "max virtual memory areas vm.max_map_count [65530] is too low"
      # Bu sysctl GLOBAL'dir, ad alanina ayrilmaz: runner'da ayarlamak kind
      # dugumunun icindeki konteyner icin de gecerli olur.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kervan
          config: infra/k8s/kind-cluster.yaml

      # Imajlar kumeye ELDEN yukleniyor; disarida bir kayit defteri yok
      # (image.pullPolicy: IfNotPresent).
      - name: Load images into the cluster
        run: |
          set -euo pipefail
          for s in api-gateway catalog-service order-service inventory-service payment-service search-service; do
            docker load -i "/tmp/images/${s}.tar.gz"
            kind load docker-image "kervan/${s}:ci" --name kervan
            # Yer ac: imaj artik kume dugumunun icinde, host daemon'da durmasi
            # gereksiz. Runner'in diski bos degil ve Docker diski dolunca
            # konteynerler "mimari/bellek hatasi" gibi gorunen sekilde cokuyor
            # (gunluk B29) -- yani yer acmak bir suslemeci degil, teshisi
            # imkansiz bir arizayi onlemek.
            docker image rm "kervan/${s}:ci" >/dev/null
            rm -f "/tmp/images/${s}.tar.gz"
          done
          df -h /

      # values-ci.yaml: yerel kind'dan farkli olarak HICBIR SEY KAPATMIYOR.
      # Runner amd64 oldugu icin Elasticsearch ve search-service de aciliyor —
      # yani alti imajin ALTISI da calistirilarak dogrulaniyor.
      - name: helm install
        run: |
          helm install kervan infra/k8s/helm/kervan \
            -f infra/k8s/helm/kervan/values-ci.yaml \
            --set image.tag=ci

      # --wait yerine bu: helm'in tek satirlik "timed out" hatasi HANGI
      # dagitimin takildigini soylemez.
      #
      # DIKKAT -- bu komutun ciktisi yanilticidir: `kubectl wait --all`
      # nesneleri SIRAYLA bekler ama zaman asimi HEPSI ICIN ORTAKTIR. Takilan
      # bir nesne butun sureyi yer ve sirasi ona gelmeyen her nesne de
      # "timed out" diye yazilir -- HAZIR OLSALAR BILE. Ilk kosusta yedi
      # dagitim basarisiz gorundu; gercekte takilan yalnizca Kafka'ydi, geri
      # kalan alti tanesi alfabetik olarak ondan SONRA geldigi icin listeye
      # dusmustu. Dogru okuma yeri: asagidaki teshis ciktisindaki pod listesi.
      #
      # 15 dakika comert ve BILEREK oyle. Kubernetes'te `depends_on` yok:
      # Postgres'e ve Elasticsearch'e bagli servisler onlar hazir olana kadar
      # cokup yeniden baslar, her cokmede backoff buyur (10s, 20s, 40s...) ve
      # sonra yakinsar. Dar bir sure, yakinsamakta olan dogru bir kumeyi
      # kirmizi yapar. Sure, calisan bir kumede zaten harcanmiyor.
      - name: Wait for every deployment
        run: kubectl wait --for=condition=Available deploy --all --timeout=15m

      - name: Smoke test
        run: scripts/smoke-k8s.sh

      # Kirmizi bir isi uzaktan teshis etmenin TEK yolu bu. Olmadan elde
      # yalnizca "smoke test failed" kalir.
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/diag
          # EN ONEMLI SATIR: hazir OLMAYAN pod'lar. Yukaridaki bekleme adimi
          # takilmayan nesneleri de basarisiz gosterebiliyor (orada aciklandi);
          # gercek listeyi burasi veriyor.
          echo "--- HAZIR OLMAYAN POD'LAR ---"
          kubectl get pods --no-headers \
            | awk '{split($2,a,"/"); if (a[1] != a[2]) print}' || true
          echo "-----------------------------"
          kubectl get pods -o wide                  > /tmp/diag/pods.txt 2>&1 || true
          kubectl get events --sort-by=.lastTimestamp > /tmp/diag/events.txt 2>&1 || true
          kubectl describe pods                     > /tmp/diag/describe.txt 2>&1 || true
          for p in $(kubectl get pods -o name); do
            n="${p#pod/}"
            # --previous: cokup yeniden baslayan pod'un ASIL hatasi onceki
            # konteynerdedir; mevcut log temiz gorunur.
            kubectl logs "$p" --tail=300          > "/tmp/diag/${n}.log"      2>&1 || true
            kubectl logs "$p" --tail=300 --previous > "/tmp/diag/${n}.prev.log" 2>&1 || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-diagnostics
          path: /tmp/diag
          retention-days: 14

      # Runner zaten atiliyor; bu adim yine de duruyor cunku betik yerelde de
      # ayni sekilde kullaniliyor ve "baslattigini kapat" aliskanligi burada
      # bozulmamali.
      - name: Delete cluster
        if: always()
        run: kind delete cluster --name kervan || true
