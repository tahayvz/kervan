# Kervan — Lokal altyapı (local infrastructure)
#
# Faz 0: PostgreSQL (işlemsel çekirdek) + MongoDB (katalog — document/NoSQL).
# Polyglot persistence, bkz. docs/ARCHITECTURE.md §2.1 ve ADR-0006.
# Her mikroservis KENDİ veritabanına sahip olacak (database-per-service). Lokalde
# tek Postgres instance içinde ayrı DB'ler açarak bunu simüle ediyoruz; prod'da ayrı olur.
#
# Sonraki fazlarda bu dosya büyüyecek:
#   Faz 2 → Keycloak
#   Faz 3 → Kafka + Schema Registry + Debezium (Kafka Connect; Mongo change streams
#           için Mongo replica set moduna alınacak)
#   Faz 5 → Elasticsearch + Redis
#   Faz 6 → Prometheus + Grafana + Jaeger + Loki
#
# Çalıştırma:  docker compose -f infra/docker/docker-compose.yml up -d
# Durdurma:    docker compose -f infra/docker/docker-compose.yml down

name: kervan

services:
  # İşlemsel çekirdek: sipariş / ödeme / stok (ACID)
  postgres:
    image: postgres:16-alpine
    container_name: kervan-postgres
    environment:
      POSTGRES_USER: kervan
      POSTGRES_PASSWORD: kervan
      POSTGRES_DB: kervan   # varsayılan; ek DB'ler init script ile açılır
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Konteyner ilk açıldığında her servis için ayrı veritabanı oluşturur
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kervan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Katalog: esnek ürün öznitelikleri (document / NoSQL) — ADR-0006
  mongodb:
    image: mongo:7
    container_name: kervan-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: kervan
      MONGO_INITDB_ROOT_PASSWORD: kervan
      MONGO_INITDB_DATABASE: catalog
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Not: Faz 3'te Debezium MongoDB connector'ı change streams okuyabilmek için
    # Mongo'nun replica set modunda olması gerekecek (tek düğümlü rs yeterli).
    # O fazda: command: ["--replSet","rs0"] + bir kez rs.initiate() eklenecek.

volumes:
  postgres-data:
  mongo-data:
