      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      # 29092, 9092 DEGIL.
      #
      # Kafka'nin IKI dinleyicisi var: 29092 ag ICI, 9092 ana makine icin.
      # 9092'ye baglanan bir istemci ilk el sikismadan sonra broker'in ILAN
