# Kervan — Lokal altyapı (local infrastructure)
#
# Faz 0: PostgreSQL (işlemsel çekirdek) + MongoDB (katalog — document/NoSQL).
# Polyglot persistence, bkz. docs/ARCHITECTURE.md §2.1 ve ADR-0006.
# Her mikroservis KENDİ veritabanına sahip olacak (database-per-service). Lokalde
# tek Postgres instance içinde ayrı DB'ler açarak bunu simüle ediyoruz; prod'da ayrı olur.
#
# Sonraki fazlarda bu dosya büyüyecek:
#   Faz 2 → Keycloak (eklendi)
#   Faz 3 → Kafka (eklendi) + Schema Registry (eklendi) + Debezium/Kafka Connect
#           (eklendi; Postgres WAL). Mongo change streams için Mongo replica set
#           moduna alınacak — sonraki adım.
#   Faz 5 → Elasticsearch (eklendi) + Redis (eklendi)
#   Faz 6 → Jaeger + OTel Collector + Prometheus + Grafana + Loki + Alloy
#           (hepsi eklendi).
#
# Çalıştırma:  docker compose -f infra/docker/docker-compose.yml up -d
# Durdurma:    docker compose -f infra/docker/docker-compose.yml down

name: kervan

services:
  # İşlemsel çekirdek: sipariş / ödeme / stok (ACID)
  postgres:
    image: postgres:16-alpine
    container_name: kervan-postgres
    # Debezium, tabloyu sorgulamaz; veritabaninin kendi degisiklik gunlugunu (WAL)
    # okur. Varsayilan wal_level=replica bu gunluge satirin ICERIGINI yazmaz,
    # yalnizca fiziksel blok degisikligini. logical seviyesinde satirlar mantiksal
    # olarak cozulebilir hale gelir; CDC'nin calismasi buna baglidir.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: kervan
      POSTGRES_PASSWORD: kervan
      POSTGRES_DB: kervan   # varsayılan; ek DB'ler init script ile açılır
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Konteyner ilk açıldığında her servis için ayrı veritabanı oluşturur
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kervan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Katalog: esnek ürün öznitelikleri (document / NoSQL) — ADR-0006
  mongodb:
    image: mongo:7
    container_name: kervan-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: kervan
      MONGO_INITDB_ROOT_PASSWORD: kervan
      MONGO_INITDB_DATABASE: catalog
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # REPLICA SET MODU — Debezium'un change streams okuyabilmesi icin sart.
    # Change streams, Mongo'nun oplog'una dayanir; oplog yalnizca replica set
    # modunda tutulur. Tek dugumlu bir set yeterli.
    #
    # Kimlik dogrulama acikken replica set uyeleri BIRBIRIYLE de dogrulasir ve
    # bunun icin ortak bir anahtar dosyasi ister. Tek dugum oldugu icin anahtarin
    # kimseyle paylasilmasi gerekmiyor; her acilista uretiliyor. Boylece depoda
    # gizli bir dosya tutmuyoruz.
    #
    # chmod 400 + chown zorunlu: mongod, herkesin okuyabildigi bir anahtar
    # dosyasiyla baslamayi reddeder.
    command: >
      bash -c "head -c 756 /dev/urandom | base64 > /tmp/rs-keyfile
      && chmod 400 /tmp/rs-keyfile
      && chown mongodb:mongodb /tmp/rs-keyfile
      && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/rs-keyfile --bind_ip_all"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Replica set'i bir kez baslatir ve cikar. rs.initiate() yalnizca ilk seferde
  # gereklidir; sonraki acilislarda durum /data/db icinde durur, bu yuzden komut
  # "zaten baslatilmis" hatasini yutar.
  #
  # Uye adresi "mongodb:27017" olarak veriliyor: Debezium ayni Docker aginda
  # oldugu icin bu adi cozebilir. Ana makineden baglanan gelistiricinin adresine
  # replicaSet=rs0 EKLEMEMESI gerekir; sebebi catalog-service application.yml'de.
  mongo-init:
    image: mongo:7
    container_name: kervan-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c "mongosh --host mongodb -u kervan -p kervan --authenticationDatabase admin --quiet --eval
      'try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}) }'"


  # Olay omurgası — ADR-0003. order-service, outbox kayıtlarını buraya taşır.
  # KRaft modunda çalışır: ayrı Zookeeper konteyneri gerekmez.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kervan-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Tek düğümlü lokal kurulum: replikasyon yapacak ikinci broker yok.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: kervan-local-cluster-1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Olay semalarinin kayit defteri — ADR-0008. Uretici semayi buraya kaydeder,
  # mesajin icine yalnizca semanin kimligini yazar; tuketici semayi buradan ceker.
  # Uyumsuz bir sema degisikligi burada reddedilir, calisan sistemde degil.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: kervan-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Semalar Kafka'da bir konuda saklanir; Registry durumsuzdur, ayri bir
      # veritabani istemez.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      # BACKWARD: yeni sema, eski semayla yazilmis veriyi okuyabilmelidir.
      # Bu kural sayesinde once tuketici, sonra uretici guncellenebilir.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      # 8081 konteyner icinde; disarida catalog-service'te oldugu icin 8085.
      - "8085:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Debezium (Kafka Connect uzerinde) — ADR-0004.
  #
  # NE YAPAR: Postgres'in degisiklik gunlugunu (WAL) okur ve outbox_messages
  # tablosuna dusen satirlari Kafka'ya tasir. Uygulama Kafka'ya hic dokunmaz;
  # yalnizca kendi veritabanina yazar. Dual-write problemi boylece kokten kalkar.
  #
  # BAGLANTI KONEKTORU ELLE KAYDEDILIR (bkz. debezium/README.md):
  #   curl -X POST -H 'Content-Type: application/json' \
  #        --data @infra/docker/debezium/order-outbox-connector.json \
  #        http://localhost:8083/connectors
  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    container_name: kervan-connect
    # Imajin ARM surumundeki Java calisma zamani bazi Mac'lerde ilk yerel cagrida
    # cokuyor (SIGILL, System.registerNatives). Bu, buradaki ayarlardan bagimsizdir.
    # amd64 surumu her yerde calisir: Linux'ta yerel, Apple Silicon'da emulasyonla.
    # Ayrinti: debezium/README.md
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: kervan-connect
      # Connect kendi durumunu Kafka'da tutar: konektor ayarlari, okunan WAL
      # konumu (offset) ve gorev durumu. Konteyner yeniden basladiginda kaldigi
      # yerden devam etmesini bunlar saglar.
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      # Tek broker var; replikasyon yapacak ikinci dugum yok.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Arama okuma modelinin deposu — ADR-0010. Katalog degisiklikleri Debezium
  # uzerinden buraya yansir; veri burada UREtilmez, yansitilir.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: kervan-elasticsearch
    # Imajin ARM surumundeki Java calisma zamani bazi Mac'lerde ilk yerel cagrida
    # cokuyor (SIGILL, System.registerNatives) — Debezium imajiyla ayni ariza.
    # amd64 surumu her yerde calisir: Linux'ta yerel, Apple Silicon'da emulasyonla.
    platform: linux/amd64
    environment:
      # Tek dugum: kume kurmuyoruz, arama indeksi turev bir veri.
      discovery.type: single-node
      # Lokal gelistirme: kimlik dogrulama kapali. Uretimde asla boyle kullanilmaz.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Onbellek ve hiz sinirlama sayaclari — ADR-0011.
  #
  # Burada duran her sey KAYBOLABILIR: onbellek veritabanindaki verinin kopyasi,
  # sayaclar ise kisa omurlu. Bu yuzden kalici disk baglanmiyor; Redis yeniden
  # baslarsa onbellek bos doner ve sayaclar sifirlanir, ikisi de kabul edilebilir.
  redis:
    image: redis:7-alpine
    container_name: kervan-redis
    ports:
      - "6379:6379"
    # maxmemory + allkeys-lru: hafiza dolunca en az kullanilan anahtarlar atilir.
    # Sinirsiz birakilsaydi Redis butun RAM'i yiyip oldurulurdu; onbellek icin
    # "eskiyi at" dogru davranis.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Kimlik saglayici — ADR-0001. order-service token uretmez, yalnizca dogrular.
  # dev modunda calisir: kalici depo yok, realm her acilista dosyadan yuklenir.
  keycloak:
    # ARM surumundeki Java calisma zamani bu makinede cokuyor:
    #   SIGILL ... java.lang.System.registerNatives ... linux-aarch64
    # Buradaki ayarlardan bagimsiz; imaj yalnizca `java -version` calistirirken
    # bile ayni sekilde coker. Teshis tek komut:
    #   docker run --rm --entrypoint java <imaj> -version
    #
    # Bu depoda ayni sorun connect ve elasticsearch'te de cikmisti. Cozum ayni:
    # amd64 surumunu SINDIRIM (digest) ile sabitle. Etiket mimariye gore cozulur,
    # digest cozulmez -- yani "platform" satiri unutulsa bile yanlis mimari gelmez.
    #
    # Surum yukseltilirken digest de guncellenmeli:
    #   docker manifest inspect quay.io/keycloak/keycloak:<surum>
    image: quay.io/keycloak/keycloak@sha256:ecd43971114b0c764f8a3288dddab73f98cb473daccc4feaffe4dc14adeaf866
    platform: linux/amd64
    container_name: kervan-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Lokal gelistirme kimlik bilgileri; uretimde asla boyle kullanilmaz.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      # Emulasyonla calistigi icin acilis yerel mimariden yavas; pencere genis
      # tutuldu. Dar birakilirsa saglikli bir Keycloak "unhealthy" sayilir ve
      # ona bagli butun servisler hic baslamaz.
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  # Tek giris noktasi. Kimlik dogrular, yetkiyi servisler denetler (ADR-0007).
  # 8080 Keycloak'ta oldugu icin on kapi 8000'de.
  api-gateway:
    build:
      context: ../..
      dockerfile: api-gateway/Dockerfile
    container_name: kervan-api-gateway
    depends_on:
      keycloak:
        condition: service_healthy
      # Saglik kosulu YOK: toplayici ayakta olmasa da ag gecidi calismali.
      # Izleme bir teshis aracidir, on kosul degil.
      otel-collector:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      KERVAN_CATALOG_URL: http://catalog-service:8081
      KERVAN_ORDER_URL: http://order-service:8082
      KERVAN_JWKS_URI: http://keycloak:8080/realms/kervan/protocol/openid-connect/certs
      KERVAN_SEARCH_URL: http://search-service:8087
      SPRING_DATA_REDIS_URL: redis://redis:6379
      # Konteyner icinden 'localhost' konteynerin KENDISIDIR; varsayilan adres
      # burada calismaz. Toplayiciya compose agindaki adiyla gidilir.
      KERVAN_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOGGING_FILE_NAME: /var/log/kervan/api-gateway.json
    volumes:
      - ../../logs:/var/log/kervan
    restart: unless-stopped

  # --- Gozlemlenebilirlik: izleme (Faz 6) ---
  #
  # Uygulamalar span'leri Jaeger'a DOGRUDAN gondermez, toplayiciya gonderir.
  # Tek adres bilirler; arkadaki depo degisirse uygulama ayari degismez.
  # Gerekce: docs/adr/0012-observability-instrumentation.md
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: kervan-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      # Servisler makinede calisiyor (konteynerde degil), bu yuzden portlar disari
      # acilmak zorunda. 4318 HTTP, 4317 gRPC.
      - "4318:4318"
      - "4317:4317"
    depends_on:
      - jaeger
    restart: unless-stopped

  # Iz deposu ve arayuzu: http://localhost:16686
  # Depo BELLEKTE. Yeniden baslatinca izler gider; lokal gelistirme icin yeterli.
  # Kalici depo (Cassandra/Elasticsearch) bu projenin konusu degil.
  jaeger:
    image: jaegertracing/jaeger:2.13.0
    container_name: kervan-jaeger
    ports:
      - "16686:16686"
    restart: unless-stopped

  # --- Gozlemlenebilirlik: metrik (Faz 6b) ---
  #
  # Prometheus metrikleri KENDISI toplar (pull). Uygulama gondermez; bir uc acar ve
  # Prometheus gelip okur. Boylece Prometheus kapaliyken uygulamanin "biriktir mi,
  # at mi, bekle mi" diye karar vermesi gerekmez. Ayrica "servis ayakta mi"
  # sorusunun cevabi bedava gelir: kazima basarisizsa `up` metrigi 0 olur.
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: kervan-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Lokal icin 7 gun yeter; disk dolmasin.
      - "--storage.tsdb.retention.time=7d"
      # Pano gelistirirken ayari yeniden yuklemek icin: POST /-/reload
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    # Servislerin cogu bu makinede calisiyor. macOS/Windows'ta Docker Desktop bu adi
    # kendisi tanimlar; Linux'ta tanimlamaz, bu satir orada da calismasini saglar.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Panolar ve veri kaynagi KODDA tanimli (observability/grafana/provisioning).
  # Elle eklenen bir pano Grafana'nin veritabaninda yasar: konteyner silinince gider
  # ve bir sonraki kisi neyin nasil olculdugunu bilemez.
  grafana:
    image: grafana/grafana:11.6.0
    container_name: kervan-grafana
    environment:
      # Lokal gelistirme: giris ekrani yok, herkes izleyebilir. Uretimde asla.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # --- Gozlemlenebilirlik: log (Faz 6c) ---
  #
  # Loki log METNINI indekslemez, yalnizca ETIKETLERI. Elasticsearch'ten farki
  # budur: cok daha ucuzdur, bedeli sorgunun once etiketle daraltilmasidir.
  loki:
    image: grafana/loki:3.4.2
    container_name: kervan-loki
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Log dosyalarini okuyup Loki'ye tasir. Uygulama Loki'yi tanimaz (ADR-0015).
  # Promtail bu isin eski aracidir ve kullanimdan kalkti; Alloy onun halefi.
  alloy:
    image: grafana/alloy:v1.7.1
    container_name: kervan-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # Depo kokundeki logs/ klasoru. Servisler JSON log'u buraya yazar.
      - ../../logs:/var/log/kervan:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  # --- Uygulama servisleri (Faz 10) ---
  #
  # Faz 10'a kadar servisler bu makinede, elle calisiyordu. Sentetik yuk icin
  # hepsinin AYNI ANDA ayakta olmasi gerekiyor; compose bunu tek komuta indiriyor.
  #
  # Hicbiri disariya PORT ACMAZ. On kapi yalnizca api-gateway'dir; Prometheus ve
  # Alloy ag icinden erisir. Bu, ADR-0014'teki "actuator is portunda degil"
  # kararinin dogal devami.
  #
  # Not: outbox yayincisi ACIK birakildi (varsayilan). Debezium yolu da calisir
  # ama konektorlerin elle kaydedilmesini gerektirir; yuk denemesi icin tek
  # komutla ayaga kalkan yol secildi. Karsilastirma: infra/docker/debezium/README.md

  catalog-service:
    build:
      context: ../..
      dockerfile: catalog-service/Dockerfile
    container_name: kervan-catalog-service
    # Saglik kosulu (service_healthy), "konteyner basladi" (service_started)
    # demek degildir: baslamis ama henuz baglanti kabul etmeyen bir veritabanina
    # baglanmaya calisan servis, gurultulu hatalarla acilir ve bazen hic acilmaz.
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://kervan:kervan@mongodb:27017/catalog?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      KERVAN_JWKS_URI: http://keycloak:8080/realms/kervan/protocol/openid-connect/certs
      KERVAN_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOGGING_FILE_NAME: /var/log/kervan/catalog-service.json
    volumes:
      - ../../logs:/var/log/kervan
    restart: unless-stopped

  order-service:
    build:
      context: ../..
      dockerfile: order-service/Dockerfile
    container_name: kervan-order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      # 29092, 9092 DEGIL.
      #
      # Kafka'nin IKI dinleyicisi var: 29092 ag ICI, 9092 ana makine icin.
      # 9092'ye baglanan bir istemci ilk el sikismadan sonra broker'in ILAN
      # ETTIGI adrese yonlendirilir; o adres "localhost:9092"dir ve konteyner
      # icinde localhost KONTEYNERIN KENDISIDIR. Sonuc:
      #   Connection to node 1 (localhost/127.0.0.1:9092) could not be established
      #
      # Servisler bu makinede calisirken 9092 DOGRUYDU. Ag icine tasiyinca
      # yanlis oldu -- adres degismedi, adresin ANLAMI degisti.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KERVAN_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KERVAN_JWKS_URI: http://keycloak:8080/realms/kervan/protocol/openid-connect/certs
      KERVAN_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOGGING_FILE_NAME: /var/log/kervan/order-service.json
    volumes:
      - ../../logs:/var/log/kervan
    restart: unless-stopped

