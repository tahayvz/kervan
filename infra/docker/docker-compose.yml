  search-service:
    build:
      context: ../..
      dockerfile: search-service/Dockerfile
    container_name: kervan-search-service
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      # 29092, 9092 DEGIL.
      #
      # Kafka'nin IKI dinleyicisi var: 29092 ag ICI, 9092 ana makine icin.
      # 9092'ye baglanan bir istemci ilk el sikismadan sonra broker'in ILAN
      # ETTIGI adrese yonlendirilir; o adres "localhost:9092"dir ve konteyner
