    restart: unless-stopped

  # Yuk ureteci. PROFILE ARKASINDA: `up -d` ile kendiliginden calismaz, cunku
  # yuk uretmek acikca istenen bir eylemdir.
  #   docker compose --profile load run --rm k6
  k6:
    image: grafana/k6:0.58.0
    container_name: kervan-k6
    profiles: ["load"]
    volumes:
      - ./load:/scripts:ro
    environment:
      KERVAN_GATEWAY: http://api-gateway:8000
      KERVAN_KEYCLOAK: http://keycloak:8080
    command: ["run", "/scripts/order-flow.js"]
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  elasticsearch-data:
  prometheus-data:
  loki-data:
  alloy-data:
