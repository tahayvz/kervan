# Prometheus — metrikleri servislerden KENDISI toplar (pull).
#
# Uygulama metrik göndermez; bir ucu açar ve Prometheus gelip okur. Sebep: gönderen
# taraf olsaydı, Prometheus kapalıyken uygulama ne yapacağına karar vermek zorunda
# kalırdı (biriktir? at? bekle?). Okuyan taraf olduğunda bu sorun yoktur — kimse
# okumazsa hiçbir şey olmaz. Ayrıca "servis ayakta mı" sorusunun cevabı ücretsiz
# gelir: kazıma başarısızsa `up` metriği 0 olur.

global:
  scrape_interval: 15s
  # Bir hedef bu süre içinde cevap vermezse kazıma başarısız sayılır. Kazıma
  # zaman aşımı aralıktan KISA olmalı; yoksa turlar üst üste biner.
  scrape_timeout: 10s

scrape_configs:
  # Ağ geçidi compose içinde çalışır: konteyner adıyla erişilir.
  # 9000 yönetim portudur ve compose onu dışarı AÇMAZ — metrikler ağ geçidinin
  # dışarıya açık 8000 portunda görünmez.
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:9000"]

  # Servislerin hepsi artık compose içinde (Faz 10). Konteyner adıyla erişiliyor
  # ve yönetim portu dışarı açılmıyor — metrikler ağın dışından görünmez.
  #
  # Tek bir servisi geliştirme için makinede çalıştırıyorsan, o hedef `down`
  # görünür. O durumda hedefi geçici olarak `host.docker.internal:90XX` yap;
  # `extra_hosts` aşağıda tanımlı olduğu için Linux'ta da çalışır.
  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:9081"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:9082"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:9084"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:9086"]

  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["search-service:9087"]
