# Loki — merkezi log deposu.
#
# Loki log METNINI indekslemez, yalnizca ETIKETLERI indeksler. Elasticsearch'ten
# temel farki budur: tam metin indeksi kurmadigi icin cok daha ucuzdur, bedeli
# ise sorgunun once etiketle daraltilmasi gerekmesidir.
#
# Bu, etiket secimini kritik yapar: sinirsiz etiket (ornegin iz kimligi) Loki'yi
# metrik tarafindaki kardinalite sorununun aynisina sokar. Iz kimligi satirin
# ICINDE durur, etiket olmaz; Grafana onu sorgu aninda cikarir.

auth_enabled: false

server:
  http_listen_port: 3100
  # Lokal gurultuyu azalt; hata ayiklarken info yapilir.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Lokalde 7 gun yeter.
  retention_period: 168h
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
