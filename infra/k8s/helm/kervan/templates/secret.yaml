# Parolalar Secret'ta, ConfigMap'te DEGIL.
#
# Ikisi de aslinda base64'tur, yani Secret "sifreli" degildir. Fark yetkidedir:
# kumede ConfigMap okuma yetkisi genis verilir, Secret okuma yetkisi dar. Ayrica
# Secret'lar RBAC, denetim kaydi ve depoda sifreleme (encryption at rest) gibi
# mekanizmalarin konusudur; ConfigMap degildir.
apiVersion: v1
kind: Secret
metadata:
  name: kervan-secrets
  labels:
    app.kubernetes.io/part-of: kervan
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.secrets.postgresUser | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MONGODB_URI: "mongodb://{{ .Values.secrets.mongoUser }}:{{ .Values.secrets.mongoPassword }}@kervan-mongodb:27017/catalog?authSource=admin"
