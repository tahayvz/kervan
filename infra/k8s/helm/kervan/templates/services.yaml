{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if ne $svc.enabled false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kervan.fullname" $name }}
  labels:
    {{- include "kervan.labels" (dict "name" $name "release" $root.Release.Name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default $root.Values.defaults.replicas }}
  # Guncelleme stratejisi ACIKCA yaziliyor.
  #
  # Varsayilanlar yuzdeliktir (maxUnavailable %25, maxSurge %25) ve TEK kopyada
  # yuvarlamaya baglidir: %25'in asagi yuvarlanmasi sayesinde kesinti olmuyor.
  # Dogru davranisin yuvarlama kuralina bagli olmasi kabul edilemez.
  #
  # maxUnavailable: 0  -> eski pod, YENISI hazir olmadan silinmez
  # maxSurge: 1        -> gecici olarak bir fazla pod olusturulabilir
  #
  # Bu ikisi + readiness probe + duzgun kapanma, guncellemeyi kesintisiz yapar.
  # Olcum: 250 istegin 250'si 200 dondu (Faz 9).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kervan.labels" (dict "name" $name "release" $root.Release.Name) | nindent 8 }}
      annotations:
        # Ayar degisince pod'lar YENIDEN OLUSSUN.
        #
        # Kubernetes bunu kendiliginden yapmaz: ConfigMap/Secret degisse bile
        # Deployment'in kendisi degismedigi icin pod'a dokunulmaz ve uygulama
        # eski degerle calismaya devam eder -- hicbir yerde hata cikmadan.
        # Icerigin ozetini buraya yazmak, degisikligi Deployment'in parcasi yapar.
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.defaults.terminationGracePeriodSeconds }}
      # Imaj zaten root olmayan bir kullaniciyla calisiyor (Dockerfile'daki USER).
      # Ama bunu IMAJ sagliyor, KUME degil: USER satirini kaybeden ya da taban
      # imaji degisen bir derleme sessizce root'a doner. runAsNonRoot bunu
      # kabul aninda reddeder -- pod hic baslamaz ve sebebi acikca yazar.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            - name: management
              containerPort: {{ $svc.managementPort }}
          envFrom:
            - configMapRef:
                name: kervan-config
            - secretRef:
                name: kervan-secrets
          # Portlar BURADAN veriliyor, application.yml'den degil.
          #
          # Onceden paket portu yalnizca IDDIA ediyordu: Service ve probe'lar
          # values.yaml'daki sayiya bakiyor, uygulama ise application.yml'deki
          # sayiya. Ikisi kayarsa konteyner baska porta baglanir, probe baska
          # porta sorar ve pod hic hazir olmaz -- hata mesaji da "probe
          # basarisiz" der, asil sebebi soylemez. Artik tek kaynak var.
          env:
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ $svc.managementPort | quote }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}

          # --- Probe'lar YONETIM portunda ---
          #
          # Is portunda degil. Ag gecidinde actuator zaten is portunda yok
          # (ADR-0014); ayrica probe trafigi is trafiginin hiz siniri ve
          # kimlik dogrulamasindan gecmemeli.

          # BASLANGIC probe'u: JVM yavas acilir. Bu olmadan ayni gecikmeyi
          # liveness'in failureThreshold'una yazmak gerekirdi ve o zaman
          # CALISIRKEN donan bir surec de aynı sure boyunca fark edilmezdi.
          # Baslangic ile calisma zamani AYRI sabirlar ister.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 3
            # timeoutSeconds ACIKCA yaziliyor; varsayilani 1 SANIYEDIR ve bu
            # sessizce yanlis olcum yapar. CI'da gorulen:
            #   Startup probe failed: Get "http://.../health/readiness":
            #   context deadline exceeded (Client.Timeout exceeded while awaiting headers)
            # Servis ayakta, ucu acik, yalnizca cevabi 1 saniyeyi asmis. Yuklu
            # bir dugumde acilmakta olan bir JVM icin bu son derece normal.
            # Sayilan basarisizlik gercek degil, OLCUM hatasiydi.
            timeoutSeconds: 2
            failureThreshold: {{ $root.Values.defaults.startupFailureThreshold }}

          # HAZIR MI: trafik alabilir mi? Bagimliligi yoksa trafik KESILIR ama
          # pod OLDURULMEZ.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # CANLI MI: surec kendini toparlayamaz halde mi? Ancak o zaman yeniden
          # baslat. Bu ucu /health/liveness'e baglamak onemli: tam /health
          # kullanilsaydi veritabani kesintisi pod'u OLDURURDU -- yeniden
          # baslatmak veritabanini geri getirmez, yalnizca yeni sorun ekler.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            # Canlilik en tehlikeli probe: basarisizligi pod'u OLDURUR. Dar bir
            # zaman asimi, gecici olarak yavaslamis (GC, yogun dugum) saglikli
            # bir servisi yeniden baslatir -- ve yeniden baslatmak yavasligi
            # cozmez, uzerine bir de soguk JVM ekler. Burada comert olmak dogru.
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # --- Endpoint yayilimi ile SIGTERM YARISI ---
          #
          # Pod silindiginde Kubernetes iki isi AYNI ANDA yapar: konteynere
          # SIGTERM gonderir ve endpoint'i kaldirir. Endpoint kaldirma her
          # dugumdeki kube-proxy'ye ASENKRON yayilir; o kisa pencerede gelen
          # istekler, kapanmaya baslamis pod'a duser ve reddedilir.
          #
          # Bu bekleme, pod'un endpoint yayilimi bitene kadar HIZMET VERMEYE
          # devam etmesini saglar. Duzgun kapanma bunun yerini tutmaz: o,
          # BASLAMIS istegi bitirir; buradaki sorun ise HENUZ BASLAMAMIS istek.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          resources:
            {{- toYaml ($svc.resources | default $root.Values.defaults.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kervan.fullname" $name }}
  labels:
    {{- include "kervan.labels" (dict "name" $name "release" $root.Release.Name) | nindent 4 }}
spec:
  # HER ZAMAN ClusterIP. Yonetim portu bu Service'te durur ve kume DISINA
  # cikmaz; Prometheus buradan kazir.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
    - name: management
      port: {{ $svc.managementPort }}
      targetPort: management
{{- if $svc.nodePort }}
---
# Disariya acilis AYRI bir Service ile ve YALNIZCA is portu icin.
#
# Once tek bir NodePort Service'te iki port birden vardi. Kubernetes, NodePort
# tipindeki bir Service'in HER portuna dugum portu atar -- pinlenmemis olana
# RASTGELE bir tane. Yani yonetim portu da disari aciliyordu (olculdu: 30276)
# ve ADR-0014'un tam tersi oluyordu: metrik ucu her dugumun IP'sinde.
#
# Ayirmak bunu yapisal olarak imkansiz kiliyor: bu Service'te yayinlanacak
# baska port yok.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kervan.fullname" $name }}-public
  labels:
    {{- include "kervan.labels" (dict "name" $name "release" $root.Release.Name) | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      nodePort: {{ $svc.nodePort }}
{{- end }}
{{- end }}
{{- end }}
