{{- if .Values.infra.enabled }}
{{/*
  Yerel kume icin EN KUCUK altyapi.

  URETIMDE BU CHART'IN PARCASI OLMAZ. Veritabani ve Kafka ya yonetilen bir
  hizmettir ya da kendi chart'indadir. Uygulamayla ayni pakette olsalardi
  uygulama surumu veritabani surumune baglanirdi: bir servis guncellemesi,
  veritabanini da yeniden olusturma riski tasirdi.

  Kalici disk de YOK (emptyDir). Bu bir deneme kumesi; pod olunce veri gider.
  Bilincli: StatefulSet + PersistentVolumeClaim yazmak bu fazin konusu degil ve
  dizustunde yalnizca disk yer.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kervan-postgres-init
data:
  01-create-databases.sql: |
    CREATE DATABASE orders;
    CREATE DATABASE payment;
    CREATE DATABASE inventory;
    GRANT ALL PRIVILEGES ON DATABASE orders    TO {{ .Values.secrets.postgresUser }};
    GRANT ALL PRIVILEGES ON DATABASE payment   TO {{ .Values.secrets.postgresUser }};
    GRANT ALL PRIVILEGES ON DATABASE inventory TO {{ .Values.secrets.postgresUser }};
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kervan-postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: kervan }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # wal_level=logical: Debezium'un okudugu mantiksal cozumleme icin
          # (ADR-0004). Varsayilan 'replica' satir icerigini WAL'a yazmaz.
          args: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
          env:
            - name: POSTGRES_USER
              value: {{ .Values.secrets.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.secrets.postgresPassword | quote }}
            - name: POSTGRES_DB
              value: kervan
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.secrets.postgresUser | quote }}]
            periodSeconds: 5
            # timeoutSeconds ACIKCA yaziliyor; varsayilani 1 SANIYE.
            # Gerekcesi kafka'nin probe'unda (bu dosyanin asagisinda) uzun uzun
            # yazili. Kisaca: yuklu bir dugumde 1 saniye hicbir seye yetmez.
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: init
          configMap: { name: kervan-postgres-init }
---
apiVersion: v1
kind: Service
metadata: { name: kervan-postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kervan-mongodb
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mongodb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongodb, app.kubernetes.io/part-of: kervan }
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.secrets.mongoUser | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: {{ .Values.secrets.mongoPassword | quote }}
          ports: [{ containerPort: 27017 }]
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            # mongosh bir Node.js surecidir; acilmasi tek basina saniyeler alir.
            # 1 saniyelik varsayilanla CI'da defalarca zaman asimina ugradi.
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: kervan-mongodb }
spec:
  selector: { app.kubernetes.io/name: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kervan-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: kervan }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 160Mi }
---
apiVersion: v1
kind: Service
metadata: { name: kervan-redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kervan-kafka
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: kervan }
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          env:
            # KRaft: ZooKeeper yok.
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            # localhost, SERVIS ADI DEGIL.
            #
            # KRaft'in birlesik (combined) modunda broker ve controller AYNI
            # surectir. Adres olarak servis adi yazilirsa kilitlenme olur:
            #   - Kubernetes Service'i yalnizca HAZIR pod'lara yonlendirir
            #   - Kafka hazir olmak icin controller'a baglanmak zorunda
            #   - controller da kendisi... ama Service onu henuz yayinlamiyor
            # Sonuc: "Connection to node 1 could not be established" sonsuza kadar.
            #
            # Compose'da bu sorun YOKTU: orada ad dogrudan konteynere cozuluyor,
            # saglik durumuna bakilmiyor. Ayni deger, farkli anlam.
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:29093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093" }
            # Kumede TEK adres var: servis adi. Compose'da iki dinleyici gerekiyordu
            # cunku hem ag icinden hem ana makineden baglanan vardi; burada ana
            # makineden baglanan yok. (Faz 10'daki 9092/29092 tuzagi buradan dogmustu.)
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kervan-kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            # CLUSTER_ID gorunusu serbest bir metin DEGIL: base64url ile
            # cozulup TAM 16 bayt olmali (bir UUID). 22 karakter tam 16 bayt
            # eder. Bir karakter eksik olursa Kafka acilmaz:
            #   "does not appear to be a valid UUID: decoded as 15 bytes"
            - { name: CLUSTER_ID, value: "kervan-k8s-cluster-001" }
          ports:
            - { containerPort: 9092 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 20
            # timeoutSeconds'IN VARSAYILANI 1 SANIYEDIR. Bu satir olmadan bu
            # probe CI'da HIC GECMEDI.
            #
            # kafka-broker-api-versions bir kabuk betigi degil, bir JVM baslatir.
            # Dort cekirdegi on bir konteynerle paylasan bir dugumde o JVM'in
            # acilmasi saniyeler surer; 1 saniyede bitmesi imkansizdir.
            #
            # Belirtisi yaniltici: Kafka'nin KENDI logunda "Kafka Server started"
            # yaziyor, "Awaiting socket connections on 0.0.0.0:9092" yaziyor --
            # yani broker CALISIYOR. Bozuk olan sey KONTROLUN KENDISI:
            #   Readiness probe failed: command timed out: ... timed out after 1s
            #   (x66 over 13m)
            # Kafka hazir sayilmadigi icin Service onu yayinlamiyor, ona bagli
            # her sey askida kaliyor ve sebep Kafka'nin logunda GORUNMUYOR.
            #
            # Bu dizustunde farkedilmedi: makine hizli ve daha az konteyner
            # calisiyordu, probe ucu ucuna geciyordu. Faz 8'in dagitim dogrulama
            # isi ilk kosusunda bunu yakaladi.
            #
            # Genel kural: exec probe bir SUREC baslatir. Baslattigi sey bir JVM
            # ya da Node ise 1 saniyelik varsayilan her zaman yanlistir.
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: kervan-kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports:
    # Controller portu BURADA YAYINLANMAZ. Quorum adresi localhost oldugu icin
    # oraya Service uzerinden kimse baglanmaz. Birakilsaydi, bir sonraki kisi
    # Service'te bir controller portu gorup quorum'u ona yonlendirebilir ve az
    # once cozulen kilitlenmeyi geri getirebilirdi.
    - { name: plaintext, port: 9092, targetPort: 9092 }

{{- if .Values.infra.elasticsearch }}
---
{{/*
  Elasticsearch — search-service'in okuma modeli (ADR-0010).

  AYRI bir anahtarla aciliyor cunku HER KUMEDE CALISMIYOR. Imajin ARM surumundeki
  Java calisma zamani bazi Mac'lerde ilk yerel cagrida cokuyor (B20) ve cozum
  amd64 surumunu emulasyonla kosturmak. Compose'da bu mumkun: `platform` satiri
  var. Kubernetes'te YOK — imaj basina platform secimi diye bir sey yok, kind
  dugumunun icinde de emulasyon yok.

  Yani: ARM dizustunde kapali (values-kind.yaml), amd64 CI runner'inda acik
  (varsayilan). Kapaliyken search-service da kapali; acilirken Elasticsearch'e
  baglanamazsa hic baslamiyor.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kervan-elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: elasticsearch }
  template:
    metadata:
      labels: { app.kubernetes.io/name: elasticsearch, app.kubernetes.io/part-of: kervan }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          env:
            # Tek dugum: kume kurmuyoruz, arama indeksi turev bir veri.
            - { name: discovery.type, value: "single-node" }
            # Lokal/CI: kimlik dogrulama kapali. Uretimde asla boyle kullanilmaz.
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
            # Disk esikleri KAPALI.
            #
            # CI runner'inin diski dolu baslar (~%70). Elasticsearch flood-stage
            # esigini asinca indeksleri SESSIZCE salt-okunur yapar: yazma 200
            # yerine 429 doner, arama calismaya devam eder ve is yesil gorunur.
            # Tek dugumlu, atilacak bir kumede esiklerin koruyacagi bir sey yok.
            - { name: cluster.routing.allocation.disk.threshold_enabled, value: "false" }
          ports: [{ containerPort: 9200 }]
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 1536Mi }
---
apiVersion: v1
kind: Service
metadata: { name: kervan-elasticsearch }
spec:
  selector: { app.kubernetes.io/name: elasticsearch }
  ports: [{ port: 9200, targetPort: 9200 }]
{{- end }}
{{- end }}
