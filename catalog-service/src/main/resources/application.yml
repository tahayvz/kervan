server:
  port: 8081

spring:
  application:
    name: catalog-service
  data:
    mongodb:
      # 12-Factor: config ortam değişkeninden gelir; lokal varsayılan compose ile uyumlu.
      # authSource=admin — root kullanıcı admin veritabanında tanımlı (compose).
      #
      #
      # Mongo artık replica set modunda (Debezium change streams için gerekli) ama
      # buradaki adres değişmedi: tek adres verildiğinde ve URI'de replicaSet
      # yazmadığında sürücü zaten doğrudan bağlanır, küme üyelerini aramaz.
      #
      # Buraya `replicaSet=rs0` EKLEME. O zaman sürücü üyeleri keşfeder ve üyenin
      # ilan ettiği adrese ("mongodb:27017") bağlanmaya çalışır; o ad Docker ağının
      # içinde çözülür, ana makinede çözülmez.
      uri: ${MONGODB_URI:mongodb://kervan:kervan@localhost:27017/catalog?authSource=admin}
      # İndeksler Mongock migration'ıyla yönetilir; Spring'in otomatik indekslemesi kapalı.
      auto-index-creation: false

    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Redis erişilemezse istek beklemesin: önbellek bir hızlandırmadır, katalog
      # onsuz da çalışmalı (bkz. CachingProductRepository).
      timeout: 1s
      connect-timeout: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          # order-service ile AYNI ayar. issuer-uri yerine jwk-set-uri: issuer-uri
          # acilista OIDC kesfi yapar ve Keycloak ayakta degilse uygulama kalkmaz.
          jwk-set-uri: ${KERVAN_JWKS_URI:http://localhost:8080/realms/kervan/protocol/openid-connect/certs}
kervan:
  cache:
    # Yazma yolunda önbellek zaten temizleniyor; bu süre doğruluk için değil emniyet
    # için. Bir temizleme kaçarsa bayat kayıt en fazla bu kadar yaşar.
    product-ttl: ${KERVAN_CACHE_PRODUCT_TTL:10m}

# Mongock — migration changeset'lerinin tarandığı paket
mongock:
  migration-scan-package: com.kervan.catalog.infrastructure.migration
  enabled: true

# Actuator — health/liveness/readiness (K8s probe'ları, Faz 9)
management:
  server:
    # Actuator, is trafiginin portunda DEGIL; ayri bir yonetim portunda.
    #
    # Tek kural, istisnasiz: olcum ve saglik uclari is trafiginin portunu
    # paylasmaz. Boylece "hangi uc acik, hangisi kapali" sorusu her serviste
    # ayni cevabi verir ve yeni bir uc eklemek guvenlik ayari gozden gecirmeyi
    # gerektirmez.
    #
    # Bu portu koruyan sey AG'dir, token degil: compose disari acmaz, Prometheus
    # agin icinden okur. Dusman bir agda calisilacaksa buraya mTLS ya da kimlik
    # dogrulama eklenir (ADR-0014).
    port: ${KERVAN_MANAGEMENT_PORT:9081}

  # --- İzleme (tracing) ---
  # Bir isteğin servisler arasında nasıl aktığının kaydı. Her adım bir "span",
  # tüm zincir bir "trace". Gerekçe ve alternatifler: ADR-0012.
  tracing:
    sampling:
      # Lokalde her istek kaydedilir. Üretimde bu oran düşürülür: her isteği
      # saklamak hem ağ hem depolama maliyetidir ve hata ayıklamak için gerekmez.
      probability: ${KERVAN_TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      # Span'ler doğrudan Jaeger'a değil toplayıcıya (OTel Collector) gider.
      # Uygulama tek bir adres bilir; arkadaki sistem değişirse uygulama değişmez.
      endpoint: ${KERVAN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      # HTTP sürelerini histogram olarak yayınla.
      #
      # Bu satır olmadan Prometheus'ta `_bucket` serileri HİÇ oluşmaz ve
      # `histogram_quantile(...)` boş döner. Pano "veri yok" gösterir, hiçbir hata
      # çıkmaz — p95 grafiği sessizce boş kalır.
      #
      # Bedeli: her uç için ~70 ek zaman serisi. Servis sayısı arttıkça bu maliyet
      # çarpılır; o noktada histogram yalnızca gerçekten gereken uçlarda açılır.
      percentiles-histogram:
        http.server.requests: true

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

# OpenAPI / Swagger UI konumu
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
